<body>

    <!--BARRA DE NAVEGAÇÃO ENTRE SITES-->

        <ul class="navbar-item"><a href="./../LOGIN E CADASTRO/login.htm">Entrar</a></ul>
    </nav>
    <div class="form-container">
        <h2 class="title">Fale conosco!</h2>
        <form onsubmit="mostrarMensagem(event)">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Insira seu nome..." required>
    
            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone" placeholder="(XX)XXXXX-XXXX" required>
    
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="user@adress.com" required>
    
            <button type="submit">Enviar</button>
        </form>
    </div>
    
    <div class="modal" id="mensagemModal">
        Aguarde o contato da nossa equipe!
        <a class="btn" href="./../index.htm">OK</a>
    </div>
    
    <script>
        function mostrarMensagem(e) {
            e.preventDefault();
            const modal = document.getElementById('mensagemModal');
            modal.classList.add('show');
            setTimeout(() => {
                modal.classList.remove('show');
            }, 4000);
        }
    </script>
