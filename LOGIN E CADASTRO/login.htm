<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Exotic</title>
    <script src="login.js"></script>
    <link rel="stylesheet" href="login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pirata+One&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Faculty+Glyphic&family=UnifrakturMaguntia&display=swap"
        rel="stylesheet">
</head>

<body class="body">
    <nav class="nav-login">
        <a href="./../PÁGINA PRINCIPAL/index.htm"><img class="logo" src="./../IMAGENS/logoexotic.png" alt=""></a>
    </nav>
    <div class="container">
        <div class="sign-up content">
            <div class="first-column">
                <h2 class="title">Bem vindo novamente.</h2>
                <div class="description">
                    <p class="description">Para conectar-se conosco</p>
                    <p class="description">por favor entre com seus dados pessoais.</p>
                </div>
                <button class="btn">ENTRAR</button>
            </div>
            <div class="second-column register">
                <h2 class="title">Criar conta</h2>

                <form action="./login.htm" onsubmit="return validarCadastro(event)" class="form">
                    <input class="data-box" type="text" placeholder="Nome*" required>
                    <input class="data-box" type="date" placeholder="Data de nascimento" required>
                    <select name="Sexo" id="sexo">
                        <option value="select*">Selecione...</option>
                        <option value="Masc">Masculino</option>
                        <option value="Fem">Feminino</option>
                    </select>
                    <input id="email" class="data-box" type="email" placeholder="Email*" required>
                    <input id="cpf" class="data-box" type="text" placeholder="CPF*" required>
                    <input id="celular" class="data-box" type="text" placeholder="Celular*" required>
                    <input id="telefone" class="data-box" type="text" placeholder="Telefone">
                    <input id="nome-da-mae" class="data-box" type="text" placeholder="Nome da mãe*" required>
                    <input id="cep" class="data-box" type="text" placeholder="CEP*" required onblur="buscarCep()">
                    <input id="logradouro" class="data-box" type="text" placeholder="Logradouro*" required>
                    <input id="numero" class="data-box" type="text" placeholder="Número*" required>
                    <input id="complemento" class="data-box" type="text" placeholder="Complemento">
                    <input id="login" class="data-box" type="text" placeholder="Login*" required>
                    <input id="senha" class="data-box" type="password" placeholder="Senha*" required>
                    <input id="confirmar-senha" class="data-box" type="password" placeholder="Confirme a senha*"
                        required>
                    <h1 class="gambiarra">a</h1>
                    <button type="submit" class="btn">FINALIZAR</button>
                </form>
            </div>
        </div>
        <div class="sign-in content">
            <div class="first-column">
                <h2 class="title">Olá, exótico!</h2>
                <p class="description">Insira suas informações pessoais e</p>
                <p class="description">comece a sua experiência conosco.</p>
                <button class="btn">CADASTRAR</button>
            </div>
            <div class="second-column">
                <h2 class="title" id="login">Entre na Exotic</h2>
                <form action="./../PÁGINA PRINCIPAL/index.htm" class="form login-form">
                    <input class="data-box" type="text" placeholder="Login" required>
                    <input class="data-box" type="password" placeholder="Senha" required>
                    <a class="forgot-password" href="https://www.youtube.com/watch?v=dQw4w9WgXcQ">Esqueceu sua
                        senha?</a>
                    <button type="submit" class="btn">ENTRAR</button>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
